<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Painel de Planos de Ação e Medidas</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300a443'/%3E%3Cstop offset='55%25' stop-color='%230b9a8a'/%3E%3Cstop offset='100%25' stop-color='%230da9ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M36 10L16 36h14l-4 18 22-26H34l2-18z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --g: #00a443;
        --b: #0da9ff;
        --o: #ff9c1a;
        --ink: #0f2a22;
        --mut: #5b6b66;
        --bg: #f2f7f5;
        --ln: #e1ebe7;
        --r: #e5484d;
        --c: #fff;
        --t: var(--ink);
        --m: var(--mut);
        --l: var(--ln);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.4 "Segoe UI",
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--t);
      }
      header {
        background: linear-gradient(110deg, var(--g), #0b9a8a 55%, var(--b));
        color: #fff;
        padding: 18px 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
      }
      .hdr-title {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .hdr-icon {
        width: 38px;
        height: 38px;
        background: rgba(255, 255, 255, 0.18);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      header h1 {
        font-size: 22px;
        margin: 0;
      }
      header small {
        opacity: 0.9;
      }
      .pill {
        background: rgba(255, 255, 255, 0.18);
        padding: 6px 12px;
        border-radius: 99px;
        font-size: 13px;
        display: flex;
        gap: 7px;
        align-items: center;
        margin-right: 8px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--o);
      }
      .dot.on {
        background: #7cffb0;
        box-shadow: 0 0 0 3px rgba(124, 255, 176, 0.3);
      }
      .dot.err {
        background: var(--r);
      }
      nav {
        display: flex;
        gap: 4px;
        padding: 8px 20px 0;
        background: var(--c);
        border-bottom: 1px solid var(--l);
        flex-wrap: wrap;
      }
      nav button {
        border: 0;
        background: none;
        padding: 10px 16px;
        cursor: pointer;
        color: var(--m);
        font-weight: 600;
        border-bottom: 3px solid transparent;
        font-size: 14px;
      }
      nav button.on {
        color: var(--g);
        border-color: var(--g);
      }
      main {
        padding: 16px 20px;
        max-width: 1550px;
        margin: auto;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
        align-items: center;
      }
      input,
      select,
      textarea {
        font: inherit;
        padding: 7px 9px;
        border: 1px solid var(--l);
        border-radius: 6px;
        background: var(--c);
        color: var(--t);
        max-width: 100%;
      }
      textarea {
        width: 100%;
        min-height: 54px;
      }
      button.btn {
        background: var(--g);
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 8px 14px;
        font-weight: 600;
        cursor: pointer;
        transition:
          opacity 0.15s,
          transform 0.1s;
      }
      button.btn:hover {
        opacity: 0.92;
      }
      button.btn.s {
        background: var(--c);
        color: var(--t);
        border: 1px solid var(--l);
      }
      button.btn.s:hover {
        background: #f4f9f7;
      }
      button.btn.d {
        background: var(--r);
      }
      button.btn.sm {
        padding: 5px 10px;
        font-size: 12px;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }
      .k {
        background: #fff;
        border-radius: 14px;
        padding: 12px 14px;
        border-top: 3px solid var(--g);
        box-shadow: 0 1px 3px rgba(15, 42, 34, 0.08);
        cursor: pointer;
        transition:
          transform 0.14s ease,
          box-shadow 0.14s ease;
        position: relative;
      }
      .k:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 14px rgba(15, 42, 34, 0.12);
      }
      .k:first-child {
        background: var(--g);
        color: #fff;
      }
      .k:first-child span {
        color: #dff5e8;
      }
      .k b {
        font-size: 28px;
        display: block;
      }
      .k span {
        color: var(--m);
        font-size: 12px;
      }
      .k .k-hint {
        position: absolute;
        top: 8px;
        right: 10px;
        font-size: 11px;
        opacity: 0.55;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
        gap: 16px;
      }
      .card {
        background: #fff;
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 1px 3px rgba(15, 42, 34, 0.08);
        border-top: 3px solid var(--g);
        overflow: auto;
      }
      .card.clean-top {
        border-top: 0;
        box-shadow: 0 2px 8px rgba(15, 42, 34, 0.07);
      }
      .card h2 {
        font-size: 15px;
        margin: 0 0 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }
      .card h2 small {
        font-weight: 400;
        color: var(--m);
        font-size: 12px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        padding: 7px 9px;
        border-bottom: 1px solid var(--l);
        text-align: left;
        vertical-align: top;
      }
      th {
        font-size: 11px;
        color: var(--m);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        position: sticky;
        top: 0;
        background: #fff;
        cursor: pointer;
        white-space: nowrap;
      }
      tr.row {
        cursor: pointer;
        transition: background 0.12s;
      }
      tr.row:hover {
        background: #00a44312;
      }
      .cell-chip {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 99px;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
        transition:
          transform 0.1s,
          filter 0.12s;
      }
      .cell-chip:hover {
        transform: scale(1.08);
        filter: brightness(0.95);
      }
      .chip-ok {
        background: #e6f6ec;
        color: #008235;
      }
      .chip-run {
        background: #e6f5ff;
        color: #0077be;
      }
      .chip-late {
        background: #fdecec;
        color: #c92a2f;
      }
      .chip-zero {
        color: var(--m);
        font-weight: 400;
      }
      .tag {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 600;
        color: #fff;
        white-space: nowrap;
      }
      .Concluído,
      .Adequado {
        background: var(--g);
      }
      .Em.andamento,
      .Andamento {
        background: var(--b);
      }
      .Atrasado,
      .Crítico {
        background: var(--r);
      }
      .A.iniciar,
      .Atenção {
        background: var(--o);
      }
      .Suspenso,
      .Cancelado,
      .Sem {
        background: #8a8f98;
      }
      .link-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: #e8f5ee;
        color: var(--g);
        border: 1px solid #bce3cd;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }
      .pb {
        height: 8px;
        background: var(--l);
        border-radius: 5px;
        overflow: hidden;
        min-width: 70px;
        display: flex;
      }
      .pb i {
        display: block;
        height: 100%;
      }
      .sp {
        display: flex;
        gap: 2px;
        align-items: flex-end;
        height: 26px;
      }
      .sp i {
        width: 7px;
        background: var(--b);
        border-radius: 2px 2px 0 0;
      }

      /* Gráfico de Atingimento Mensal das Medidas */
      .mchart-outer {
        padding: 26px 6px 26px;
      }
      .mchart-wrap {
        position: relative;
        height: 185px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 8px;
      }
      .mchart-meta-line {
        position: absolute;
        left: 0;
        right: 0;
        border-top: 1.5px dashed #a8b7b1;
        pointer-events: none;
        z-index: 1;
      }
      .mchart-meta-line span {
        position: absolute;
        right: 2px;
        top: -17px;
        font-size: 11px;
        color: var(--m);
        background: rgba(255, 255, 255, 0.88);
        padding: 0 4px;
        border-radius: 4px;
      }
      .mbar-col {
        flex: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        position: relative;
        z-index: 2;
        cursor: pointer;
      }
      .mbar-col.empty {
        cursor: default;
        opacity: 0.45;
      }
      .mbar-fill {
        width: 100%;
        max-width: 34px;
        border-radius: 5px 5px 2px 2px;
        transition:
          transform 0.14s ease,
          filter 0.14s ease;
        min-height: 4px;
        position: relative;
      }
      .mbar-val {
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%);
        margin-bottom: 4px;
        font-size: 11px;
        font-weight: 700;
        color: var(--ink);
        white-space: nowrap;
      }
      .mbar-col:not(.empty):hover .mbar-fill {
        transform: scaleY(1.03);
        transform-origin: bottom;
        filter: brightness(0.92);
      }
      .mbar-lbl {
        position: absolute;
        top: 100%;
        margin-top: 6px;
        font-size: 11px;
        color: var(--m);
        font-weight: 500;
      }

      /* Lista de Medidas Mais Críticas */
      .crit-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 360px;
        overflow-y: auto;
        padding-right: 4px;
      }
      .crit-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border: 1px solid var(--l);
        border-radius: 10px;
        background: #fff;
        cursor: pointer;
        transition:
          border-color 0.14s,
          background 0.14s,
          transform 0.12s;
      }
      .crit-item:hover {
        border-color: var(--g);
        background: #f5fbf8;
        transform: translateX(2px);
      }
      .crit-rank {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--ink);
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .crit-body {
        flex: 1;
        min-width: 0;
      }
      .crit-title {
        font-weight: 700;
        font-size: 13px;
        color: var(--ink);
        margin-bottom: 2px;
        word-break: break-word;
      }
      .crit-meta {
        font-size: 11.5px;
        color: var(--m);
      }
      .crit-pct {
        font-weight: 700;
        font-size: 12px;
        padding: 3px 9px;
        border-radius: 99px;
        color: #fff;
        flex-shrink: 0;
      }

      dialog {
        border: 0;
        border-radius: 12px;
        padding: 0;
        width: min(980px, 96vw);
        background: var(--c);
        color: var(--t);
        max-height: 92vh;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      }
      dialog::backdrop {
        background: rgba(15, 42, 34, 0.55);
        backdrop-filter: blur(2px);
      }
      .mh {
        padding: 14px 18px;
        background: var(--g);
        color: #fff;
        font-weight: 700;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .mh button.xclose {
        background: rgba(255, 255, 255, 0.2);
        border: 0;
        color: #fff;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mh button.xclose:hover {
        background: rgba(255, 255, 255, 0.32);
      }
      .mb {
        padding: 16px 18px;
        overflow: auto;
        max-height: 74vh;
      }
      .mf {
        padding: 12px 18px;
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        align-items: center;
        border-top: 1px solid var(--l);
        flex-wrap: wrap;
      }
      .f {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 10px;
      }
      .f label {
        display: block;
        font-size: 12px;
        color: var(--m);
        font-weight: 600;
        margin-bottom: 3px;
      }
      .f .w {
        grid-column: 1/-1;
      }
      .f input,
      .f select {
        width: 100%;
      }
      .sec-divider {
        grid-column: 1 / -1;
        background: #f2f7f5;
        border-left: 4px solid var(--g);
        padding: 8px 12px;
        font-weight: 700;
        color: var(--ink);
        font-size: 13px;
        margin: 8px 0 2px;
        border-radius: 0 6px 6px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .mg {
        display: grid;
        grid-template-columns: 50px repeat(12, 1fr);
        gap: 4px;
        margin-top: 8px;
        align-items: center;
        font-size: 12px;
      }
      .mg input {
        width: 100%;
        padding: 5px 3px;
        text-align: center;
      }
      .warn {
        color: var(--r);
        font-size: 12px;
      }
      .rank-num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--g);
        color: #fff;
        font-weight: 700;
        font-size: 11px;
      }
      .drill-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .drill-tabs button {
        border: 1px solid var(--l);
        background: #f7faf9;
        padding: 6px 12px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        color: var(--m);
      }
      .drill-tabs button.on {
        background: var(--g);
        color: #fff;
        border-color: var(--g);
      }
      #toast {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        background: #222;
        color: #fff;
        padding: 10px 18px;
        border-radius: 8px;
        display: none;
        z-index: 99;
      }

      /* Login Screen Styles */
      #login-screen {
        position: fixed;
        inset: 0;
        background: var(--bg);
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        background: #fff;
        padding: 32px 28px;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(15, 42, 34, 0.1);
        width: 100%;
        max-width: 360px;
        text-align: center;
        border-top: 4px solid var(--g);
      }
      .login-icon {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--g), #0b9a8a 60%, var(--b));
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 12px;
      }
      .login-card h2 {
        margin: 0 0 8px;
        color: var(--g);
        font-size: 20px;
      }
      .login-card p {
        color: var(--m);
        font-size: 13px;
        margin: 0 0 24px;
      }
      .login-card input {
        width: 100%;
        margin-bottom: 16px;
        padding: 10px 12px;
        font-size: 14px;
        text-align: center;
      }
      .login-card button {
        width: 100%;
        padding: 10px;
        font-size: 14px;
      }

      @media (max-width: 600px) {
        .grid-2 {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <!-- Overlay de Login -->
    <div id="login-screen">
      <div class="login-card">
        <div class="login-icon">
          <svg
            width="28"
            height="28"
            viewBox="0 0 64 64"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path d="M36 10L16 36h14l-4 18 22-26H34l2-18z" fill="#fff" />
          </svg>
        </div>
        <div id="login-form-box">
          <h2>Planos de Ação e Medidas</h2>
          <p>Identifique-se com seu e-mail autorizado</p>
          <input
            type="email"
            id="login-email"
            placeholder="Seu e-mail (ex: seu@email.com)"
          />
          <input
            type="text"
            id="login-user"
            placeholder="Seu nome (ex: Lucas Souza)"
            onkeypress="if (event.key === 'Enter') doLogin();"
          />
          <button class="btn" onclick="doLogin()">Acessar Painel</button>
        </div>
        <div id="login-denied-box" style="display: none; text-align: center">
          <div style="color: var(--r); font-size: 42px; margin-bottom: 12px">
            🚫
          </div>
          <h2 style="color: var(--r); margin-bottom: 8px">Acesso Negado</h2>
          <p style="color: var(--m); font-size: 13px; margin-bottom: 20px">
            Esta pessoa não pode acessar o painel. O seu e-mail não possui
            autorização cadastrada no sistema.
          </p>
          <button class="btn s" onclick="resetLogin()">
            Tentar Outro E-mail
          </button>
        </div>
      </div>
    </div>

    <header>
      <div class="hdr-title">
        <div class="hdr-icon">
          <svg
            width="24"
            height="24"
            viewBox="0 0 64 64"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path d="M36 10L16 36h14l-4 18 22-26H34l2-18z" fill="#fff" />
          </svg>
        </div>
        <div>
          <h1>Planos de Ação e Medidas</h1>
          <small>Acompanhamento das UTDs · Neoenergia</small>
        </div>
      </div>
      <div style="display: flex; align-items: center; flex-wrap: wrap">
        <div class="pill">
          <span class="dot" id="dot"></span><span id="sy"></span>
        </div>
        <button
          class="btn"
          style="background: #fff; color: var(--g)"
          id="usr"
          title="Sair"
        ></button>
      </div>
    </header>
    <nav id="nav"></nav>
    <main>
      <div class="bar" id="flt"></div>
      <div id="v"></div>
    </main>
    <dialog id="drill"></dialog>
    <dialog id="dlg"></dialog>
    <div id="toast"></div>

    <script>
      /* BASE INICIAL ZERADA PARA NOVAS INSERÇÕES */
      const SEED = {
        PA: [],
        PM: [],
      };

      /* HIERARQUIA DE ORIGENS, SETORES E UNIDADES (UTDs) */
      const ORIGENS = [
        "Reunião de Governança Superintendência",
        "Reunião de Governança Setorial - Oeste",
        "Reunião de Governança Setorial - Sudoeste",
        "Reunião de Governança Setorial - Centro Oeste",
        "RAD Superintendência",
        "RAD Gerência - Oeste",
        "RAD Gerência - Sudoeste",
        "RAD Gerência - Centro Oeste",
        "Reunião com a área central",
        "FEM - STN",
      ];

      const SETORES_UTDS = {
        "CENTRO OESTE": [
          "IRECÊ",
          "ITABERABA",
          "LIVRAMENTO NS",
          "SEABRA",
          "JEQUIÉ",
        ],
        OESTE: [
          "BARREIRAS",
          "BOM JESUS DA LAPA",
          "IBOTIRAMA",
          "LUÍS EDUARDO MAGALHÃES",
          "STA MARIA DA VITÓRIA",
        ],
        SUDOESTE: ["VIT DA CONQUISTA", "ITAPETINGA", "GUANAMBI", "BRUMADO"],
      };

      const SETORES = Object.keys(SETORES_UTDS);
      const TODAS_UTDS = Object.values(SETORES_UTDS).flat().sort();

      function setorDaUtd(utd) {
        if (!utd) return "";
        const u = utd.toUpperCase().trim();
        if (u === "VITÓRIA DA CONQUISTA") return "SUDOESTE";
        for (const [s, lista] of Object.entries(SETORES_UTDS)) {
          if (lista.includes(u)) return s;
        }
        return "";
      }

      function setorDaOrigem(orig) {
        if (!orig) return "";
        if (orig.endsWith("- Centro Oeste")) return "CENTRO OESTE";
        if (orig.endsWith("- Sudoeste")) return "SUDOESTE";
        if (orig.endsWith("- Oeste")) return "OESTE";

      /* DADOS DE ACESSO AO SUPABASE */
      const SB = {

      const K = "painelPAM_nuvem_v2",

      let activeDrill =

      function resetLogin() {

      function toast(m) {
        const t = $("#toast");
        t.textContent = m;
        t.style.display = "block";
        setTimeout(() => (t.style.display = "none"), 3500);
      }

      const live = (a) => a.filter((x) => !x.del);
      function stat(p) {
        if (p.sm) return p.sm;
        const T = today();
        if (p.fr) return "Concluído";
        if (p.fp && p.fp < T) return "Atrasado";
        if (p.ir) return "Em andamento";
        if (p.ip && p.ip > T) return "A iniciar";
        return p.ip ? "Em andamento" : "A iniciar";
      }

      function pmMesPct(m, i) {
        const p = m.prev?.[i],
          r = m.real?.[i];
        if (r == null || p == null) return null;
        if (m.sentido === "Quanto Menor Melhor") {
          return r <= p ? 1 : r > 0 ? p / r : 0;
        }
        return p > 0 ? r / p : r >= 0 ? 1 : 0;
      }

      function pm(m) {
        const ms = [...Array(12).keys()].filter(
          (i) => m.real[i] != null && m.prev[i] != null,
        );
        if (!ms.length) return null;
        const ag = (a) =>
            m.unid === "%"
              ? a.reduce((x, y) => x + y, 0) / a.length
              : a.reduce((x, y) => x + y, 0),
          P = ag(ms.map((i) => m.prev[i])),
          R = ag(ms.map((i) => m.real[i]));
        const pct =
          m.sentido === "Quanto Menor Melhor"
            ? R <= P
              ? 1
              : R > 0
                ? P / R
                : 0
            : P > 0
              ? R / P
              : 1;
        return {
          P,
          R,
          pct,
          s: pct >= 1 ? "Adequado" : pct >= 0.8 ? "Atenção" : "Crítico",
        };
      }

      const fn = (v) =>
          v == null || v === ""
            ? "–"
            : (+v).toLocaleString("pt-BR", { maximumFractionDigits: 2 }),
        fd = (d) => (d ? d.split("-").reverse().join("/") : "–");
      const tag = (s) => `<span class="tag ${esc(s)}">${esc(s)}</span>`;
      const nz = (s) =>
        String(s ?? "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();

      function getSetor(x) {
        return x.setor || setorDaUtd(x.utd) || setorDaOrigem(x.origem) || "";
      }

      function hay(x) {
        const s =
          x.medida !== undefined ? (pm(x) ? pm(x).s : "Sem apuração") : stat(x);
        return nz(
          [
            x.id,
            x.paId,
            x.pmId,
            x.origem,
            getSetor(x),
            x.utd,
            x.indicador,
            x.acao,
            x.medida,
            x.causa,
            x.como,
            x.onde,
            x.quem,
            x.custo,
            x.obs,
            x.unid,
            x.sentido,
            x.meta,
            s,
            x.ip,
            fd(x.ip),
            x.fp,
            fd(x.fp),
            x.fr,
            fd(x.fr),
            x.by,
          ].join(" "),
        );
      }

      function match(x, extra) {
        const st = getSetor(x);
        return (
          (!F.orig || x.origem === F.orig) &&
          (!F.setor || st === F.setor) &&
          (!F.utd || x.utd === F.utd) &&
          (!F.ind || x.indicador === F.ind) &&
          (!F.q ||
            ((h) =>
              nz(F.q)
                .split(/\s+/)
                .filter(Boolean)
                .every((w) => h.includes(w)))(hay(x))) &&
          (!extra || extra(x))
        );
      }

      const uniq = (k) =>
        [
          ...new Set(
            [...live(S.PA), ...live(S.PM)].map((x) => x[k]).filter(Boolean),
          ),
        ].sort();

      function utdsParaFiltro() {
        const base =
          F.setor && SETORES_UTDS[F.setor] ? SETORES_UTDS[F.setor] : TODAS_UTDS;
        const extras = uniq("utd").filter(
          (u) => !F.setor || setorDaUtd(u) === F.setor,
        );
        return [...new Set([...base, ...extras])].sort();
      }

      function hasActiveFilters() {
        return Boolean(F.orig || F.setor || F.utd || F.ind || F.q || F.st);
      }

      function nav() {
        $("#nav").innerHTML = [
          ["geral", "Visão geral"],

            ([k, n]) =>
              `<button class="${tab == k ? "on" : ""}" data-t="${k}">${n}</button>`,

          .join("");
        $("#usr").textContent = "👤 " + user + " (Sair)";
        const utdList = utdsParaFiltro();
        $("#flt").innerHTML =
          `<select id="fo"><option value="">Todas as origens</option>${ORIGENS.map((o) => `<option ${F.orig == o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>` +
          `<select id="fset"><option value="">Todos os setores</option>${SETORES.map((s) => `<option ${F.setor == s ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>` +
          `<select id="fu"><option value="">Todas as UTDs</option>${utdList.map((u) => `<option ${F.utd == u ? "selected" : ""}>${esc(u)}</option>`).join("")}</select>` +
          `<select id="fi"><option value="">Todos os indicadores</option>${uniq(
            "indicador",
          )
            .map(
              (u) =>
                `<option ${F.ind == u ? "selected" : ""}>${esc(u)}</option>`,
            )
            .join("")}</select>` +
          `<input id="fq" placeholder="Buscar em tudo: ação, medida, responsável, origem, status…" style="min-width:240px;flex:1" value="${esc(F.q)}">` +
          (tab == "pa"
            ? `<select id="fs"><option value="">Todos os status</option>${ST.map((s) => `<option ${F.st == s ? "selected" : ""}>${s}</option>`).join("")}</select>`
            : "") +
          (hasActiveFilters()
            ? `<button class="btn s" id="clr-flt" title="Limpar todos os filtros">✕ Limpar</button>`
            : "") +
          (tab == "pa"
            ? `<button class="btn" data-n="pa">+ Nova ação (+ medida)</button>`

          (tab == "pm"
            ? `<button class="btn" data-n="pm">+ Nova medida (+ ação)</button>`
            : "") +
          (tab == "geral"
            ? `<button class="btn" data-n="pa">+ Novo Plano (Ação + Medida)</button>`
            : "");
      }

      function render() {
        if (!user) return;

        if ($("#drill").open && activeDrill) {

      function bar(c) {
        const t = Object.values(c).reduce((a, b) => a + b, 0) || 1,
          col = {
            Concluído: "--g",
            "Em andamento": "--b",
            "A iniciar": "--o",

        return `<div class="pb">${Object.entries(c)
          .map(
            ([k, v]) =>
              `<i title="${k}: ${v}" style="width:${(v / t) * 100}%;background:var(${col[k] || "--m"})"></i>`,
          )
          .join("")}</div>`;
      }

      function alerts() {
        const a = [];
        const paMap = new Map(live(S.PA).map((p) => [p.id, p]));
        const pmMap = new Map(live(S.PM).map((m) => [m.id, m]));
        live(S.PA)
          .filter((p) => match(p))
          .forEach((p) => {
            const w = [];
            if (p.ip && p.fp && p.fp < p.ip)
              w.push("fim previsto anterior ao início");
            if (!p.quem) w.push("sem responsável");
            if (!p.fp) w.push("sem prazo previsto");
            if (p.fr && p.ir && p.fr < p.ir)
              w.push("fim real anterior ao início real");
            if (!p.pmId || !pmMap.has(p.pmId))
              w.push("sem Plano de Medida vinculado");
            if (w.length) a.push({ t: "pa", id: p.id, u: p.utd, x: p.acao, w });
          });
        live(S.PM)
          .filter((m) => match(m))

            const w = [];

              w.push("sem Plano de Ação vinculado");

              a.push({ t: "pm", id: m.id, u: m.utd, x: m.medida, w });
          });
        return a;
      }

      /* Card 1 recuperado: Atingimento mensal das medidas */
      function buildMonthlyChart(mm) {
        const mVals = MES.map((_, i) => {
          const ratios = [];
          mm.forEach((m) => {
            const pct = pmMesPct(m, i);
            if (pct != null && isFinite(pct)) ratios.push(pct);
          });
          if (!ratios.length) return null;
          return ratios.reduce((a, b) => a + b, 0) / ratios.length;
        });

        const valid = mVals.filter((v) => v != null);
        if (!valid.length) {
          return `<div class="card clean-top"><h2><span>Atingimento mensal das medidas</span><small>média real ÷ previsto · verde ≥100% · laranja ≥80%</small></h2><p style="color:var(--m);margin:24px 0;text-align:center">Nenhuma medida com previsto e realizado apurados ainda.</p></div>`;
        }

        const maxVal = Math.max(1.25, ...valid);
        const metaBottomPct = Math.min(95, Math.max(10, (1 / maxVal) * 100));

        const cols = mVals
          .map((v, i) => {
            if (v == null) {
              return `<div class="mbar-col empty" title="${MES[i]}: sem apuração"><div class="mbar-fill" style="height:4px;background:var(--l)"><span class="mbar-val">–</span></div><div class="mbar-lbl">${MES[i]}</div></div>`;
            }
            const pctInt = Math.round(v * 100);
            const hPct = Math.max(3, Math.min(100, (v / maxVal) * 100));
            const color =
              v >= 1 ? "var(--g)" : v >= 0.8 ? "var(--o)" : "var(--r)";
            return `<div class="mbar-col" data-drill="mes" data-val="${i}" title="Clique para ver as medidas de ${MES[i]} (${pctInt}%)"><div class="mbar-fill" style="height:${hPct}%;background:${color}"><span class="mbar-val">${pctInt}%</span></div><div class="mbar-lbl">${MES[i]}</div></div>`;
          })
          .join("");

        return `<div class="card clean-top">
          <h2><span>Atingimento mensal das medidas</span><small>média real ÷ previsto · verde ≥100% · laranja ≥80%</small></h2>
          <div class="mchart-outer">
            <div class="mchart-wrap">
              <div class="mchart-meta-line" style="bottom: ${metaBottomPct}%"><span>meta 100%</span></div>
              ${cols}
            </div>
          </div>
          <small style="color:var(--m);display:block;margin-top:4px"> Clique em qualquer barra mensal para inspecionar as medidas apuradas naquele mês.</small>
        </div>`;
      }

      /* Card 2 recuperado: Medidas mais críticas */
      function buildCriticalMeasures(mm) {
        const crit = mm
          .map((m) => ({ m, r: pm(m) }))
          .filter((item) => item.r != null)
          .sort(
            (a, b) => a.r.pct - b.r.pct || a.m.medida.localeCompare(b.m.medida),
          )
          .slice(0, 10);

        const body = crit.length
          ? `<div class="crit-list">${crit
              .map(({ m, r }, idx) => {
                const pctInt = Math.round(r.pct * 100);
                const color =
                  r.pct >= 1
                    ? "var(--g)"
                    : r.pct >= 0.8
                      ? "var(--o)"
                      : "var(--r)";
                const sub = [getSetor(m), m.utd, m.indicador]
                  .filter(Boolean)
                  .join(" · ");
                return `<div class="crit-item" data-e="pm:${esc(m.id)}" title="Clique para abrir e editar esta medida e sua ação vinculada">
                <span class="crit-rank">${idx + 1}</span>
                <div class="crit-body">
                  <div class="crit-title">${esc(m.medida)}</div>
                  <div class="crit-meta">${esc(sub)}</div>
                </div>
                <span class="crit-pct" style="background:${color}">${pctInt}%</span>
              </div>`;
              })
              .join("")}</div>`
          : `<p style="color:var(--m);margin:24px 0;text-align:center">Nenhuma medida apurada para classificar ainda.</p>`;

        return `<div class="card clean-top">
          <h2><span>Medidas mais críticas</span><small>menor atingimento</small></h2>
          ${body}
        </div>`;
      }

      function geral() {
        const paList = live(S.PA).filter((p) => match(p)),
          mm = live(S.PM).filter((m) => match(m)),
          c = {};
        paList.forEach((p) => {
          const s = stat(p);
          c[s] = (c[s] || 0) + 1;
        });
        const ap = mm.map(pm),
          ok = ap.filter((x) => x && x.s == "Adequado").length,
          n = ap.filter(Boolean).length;

        /* Top 10 Responsáveis por Plano de Ação (100% interativo) */
        const respMap = {};
        paList.forEach((p) => {
          const raw = (p.quem || "").trim();
          const nome = raw ? raw : "(Sem responsável)";
          if (!respMap[nome]) respMap[nome] = { total: 0, st: {} };
          respMap[nome].total++;
          const s = stat(p);
          respMap[nome].st[s] = (respMap[nome].st[s] || 0) + 1;
        });
        const top10Resp = Object.entries(respMap)
          .sort((a, b) => b[1].total - a[1].total || a[0].localeCompare(b[0]))
          .slice(0, 10);

        const tblTop10 = top10Resp.length
          ? `<table><tr><th>#</th><th>Responsável (Quem)</th><th>Total de Ações</th><th>Concluídas</th><th>Em andamento</th><th>Atrasadas</th><th>Progresso</th><th>% Concluído</th></tr>${top10Resp
              .map(([nome, d], idx) => {
                const conc = d.st["Concluído"] || 0;
                const and = d.st["Em andamento"] || 0;
                const atr = d.st["Atrasado"] || 0;
                const pct = d.total ? Math.round((conc / d.total) * 100) : 0;
                return `<tr class="row" data-drill="resp" data-val="${esc(nome)}" title="Clique para ver todos os planos de ${esc(nome)}">
                <td><span class="rank-num">${idx + 1}</span></td>
                <td><b>${esc(nome)}</b></td>
                <td><b>${d.total}</b></td>
                <td>${conc ? `<span class="cell-chip chip-ok" data-drill="resp" data-val="${esc(nome)}" data-sub="Concluído" title="Ver ações concluídas de ${esc(nome)}">${conc}</span>` : `<span class="chip-zero">0</span>`}</td>
                <td>${and ? `<span class="cell-chip chip-run" data-drill="resp" data-val="${esc(nome)}" data-sub="Em andamento" title="Ver ações em andamento de ${esc(nome)}">${and}</span>` : `<span class="chip-zero">0</span>`}</td>
                <td>${atr ? `<span class="cell-chip chip-late" data-drill="resp" data-val="${esc(nome)}" data-sub="Atrasado" title="Ver ações atrasadas de ${esc(nome)}">${atr}</span>` : `<span class="chip-zero">0</span>`}</td>
                <td>${bar(d.st)}</td>
                <td>${pct}%</td>
              </tr>`;
              })
              .join("")}</table>`
          : `<p style="color:var(--m);margin:4px 0">Nenhum plano de ação cadastrado para os filtros selecionados.</p>`;

        const grp = (k, label) => {
          const g = {};
          paList.forEach((p) => {
            const key =
              (k === "setor" ? getSetor(p) : p[k]) || "(Não informado)";
            (g[key] ??= { pa: {}, m: [0, 0] }).pa[stat(p)] =
              (g[key].pa[stat(p)] || 0) + 1;
          });
          mm.forEach((m) => {
            const key =
              (k === "setor" ? getSetor(m) : m[k]) || "(Não informado)";
            const r = pm(m);
            (g[key] ??= { pa: {}, m: [0, 0] }).m[1] += r ? 1 : 0;
            if (r && r.s == "Adequado") g[key].m[0]++;
          });
          const entries = Object.entries(g).sort();
          if (!entries.length)
            return `<p style="color:var(--m);margin:4px 0">Sem registros ainda.</p>`;
          return `<table><tr><th>${label}</th><th>Ações</th><th>Andamento das ações</th><th>% concluído</th><th>Medidas adequadas</th></tr>${entries
            .map(([nome, v]) => {
              const t = Object.values(v.pa).reduce((a, b) => a + b, 0);
              return `<tr class="row" data-drill="grp" data-val="${esc(nome)}" data-sub="${esc(k)}" title="Clique para ver os planos e medidas de ${esc(nome)}"><td>${esc(nome)}</td><td><b>${t}</b></td><td>${bar(v.pa)}</td><td>${t ? Math.round(((v.pa["Concluído"] || 0) / t) * 100) : 0}%</td><td>${v.m[1] ? `${v.m[0]}/${v.m[1]} (${Math.round((v.m[0] / v.m[1]) * 100)}%)` : "–"}</td></tr>`;
            })
            .join("")}</table>`;
        };

        const al = alerts();
        return `<div class="kpis">
          <div class="k" data-drill="status" data-val="" title="Clique para listar todas as ações">
            <span class="k-hint"></span>
            <b>${paList.length}</b><span>Ações no total</span>
          </div>
          ${["Concluído", "Em andamento", "A iniciar", "Atrasado"].map((s) => `<div class="k" data-drill="status" data-val="${esc(s)}" title="Clique para ver ações com status ${esc(s)}" style="border-top-color:var(${{ Concluído: "--g", "Em andamento": "--b", "A iniciar": "--o", Atrasado: "--r" }[s]})"><span class="k-hint"></span><b>${c[s] || 0}</b><span>${s}</span></div>`).join("")}
          <div class="k" data-drill="medidas_status" data-val="Adequado" title="Clique para ver as medidas apuradas">
            <span class="k-hint"></span>
            <b>${n ? Math.round((ok / n) * 100) + "%" : "–"}</b><span>Medidas adequadas (${ok}/${n} apuradas)</span>
          </div>
        </div>
 ${
   F.q
     ? `<div class="card"><h2> Resultados para “${esc(F.q)}” (${paList.length} ações · ${mm.length} medidas)</h2>${
         paList.length + mm.length
           ? `<table>${paList
               .slice(0, 100)
               .map(
                 (p) =>
                   `<tr class="row" data-e="pa:${p.id}"><td>Ação</td><td>${esc(p.origem)}</td><td>${esc(getSetor(p))}</td><td>${esc(p.utd)}</td><td>${esc(p.indicador)}</td><td>${esc(p.acao)}</td><td>${esc(p.quem)}</td><td>${tag(stat(p))}</td></tr>`,
               )

               .slice(0, 100)
               .map((m) => {

                 return `<tr class="row" data-e="pm:${m.id}"><td>Medida</td><td>${esc(m.origem)}</td><td>${esc(getSetor(m))}</td><td>${esc(m.utd)}</td><td>${esc(m.indicador)}</td><td>${esc(m.medida)}</td><td></td><td>${tag(r ? r.s : "Sem apuração")}</td></tr>`;
               })
               .join("")}</table>`
           : "Nada encontrado."
       }</div>`
     : ""
 }
 <div class="grid-2">${buildMonthlyChart(mm)}${buildCriticalMeasures(mm)}</div>
 <div class="card"><h2><span> Top 10 Responsáveis por Planos de Ação</span><small>Clique no responsável ou nos números de status para detalhar</small></h2>${tblTop10}</div>
 <div class="grid-2"><div class="card"><h2><span>Por Origem</span><small>clique na linha para detalhar</small></h2>${grp("origem", "Origem")}</div><div class="card"><h2><span>Por Setor</span><small>clique na linha para detalhar</small></h2>${grp("setor", "Setor")}</div></div>
 <div class="grid-2"><div class="card"><h2><span>Por UTD</span><small>clique na linha para detalhar</small></h2>${grp("utd", "UTD")}</div><div class="card"><h2><span>Por Indicador</span><small>clique na linha para detalhar</small></h2>${grp("indicador", "Indicador")}</div></div>
 <div class="card"><h2>⚠ Pontos de atenção na qualidade dos dados (${al.length})</h2>${
   al.length
     ? `<table>${al
         .slice(0, 60)
         .map(
           (a) =>
             `<tr class="row" data-e="${a.t}:${a.id}"><td>${esc(a.u)}</td><td>${esc(a.x).slice(0, 80)}</td><td class="warn">${esc(a.w.join("; "))}</td></tr>`,
         )
         .join(
           "",
         )}</table>${al.length > 60 ? `<small>+${al.length - 60} outros</small>` : ""}`
     : "Nenhum ponto de atenção."
 }</div>`;
      }

      /* QUADRO INTERATIVO DE DETALHAMENTO (DRILL-DOWN MODAL) */
      function openDrill(type, val, sub = "", viewTab = "") {
        activeDrill = { type, val, sub, viewTab };
        const allPA = live(S.PA).filter((p) => match(p));
        const allPM = live(S.PM).filter((m) => match(m));
        const pmMap = new Map(live(S.PM).map((m) => [m.id, m]));
        const paMap = new Map(live(S.PA).map((p) => [p.id, p]));

        let title = "";
        let subtitle = "";
        let filteredPA = [];
        let filteredPM = [];
        let mode = "pa"; /* "pa", "pm", "both", "mes" */
        let goAction =
          null; /* função opcional para redirecionar para a aba correspondente */

        if (type === "status") {
          mode = "pa";
          filteredPA = val ? allPA.filter((p) => stat(p) === val) : allPA;
          title = val ? `Planos de Ação — ${val}` : "Todos os Planos de Ação";
          subtitle = `${filteredPA.length} ação(ões) encontrada(s)`;
          goAction = {
            label: "Ver na aba Planos de Ação →",
            run: () => {
              F.st = val || "";
              tab = "pa";
            },
          };
        } else if (type === "resp") {
          mode = "pa";
          filteredPA = allPA.filter((p) => {
            const nome = (p.quem || "").trim() || "(Sem responsável)";
            return nome === val && (!sub || stat(p) === sub);
          });
          title = sub
            ? `Planos de ${val} — ${sub}`
            : `Planos de Ação de ${val}`;
          subtitle = `${filteredPA.length} ação(ões) atribuída(s)`;
          goAction = {
            label: "Filtrar na aba Planos de Ação →",
            run: () => {
              F.q = val === "(Sem responsável)" ? "" : val;
              F.st = sub || "";
              tab = "pa";
            },
          };
        } else if (type === "medidas_status") {
          mode = "pm";
          const sel = viewTab || "todas";
          const apuradas = allPM.filter((m) => pm(m) != null);
          filteredPM =
            sel === "todas"
              ? allPM
              : sel === "Sem apuração"
                ? allPM.filter((m) => pm(m) == null)
                : apuradas.filter((m) => pm(m).s === sel);
          title = "Planos de Medidas — Detalhamento";
          subtitle = `${apuradas.length} apurada(s) de ${allPM.length} medida(s)`;
          activeDrill.viewTab = sel;
          goAction = {
            label: "Ir para aba Planos de Medidas →",
            run: () => {
              tab = "pm";
            },
          };
        } else if (type === "mes") {
          mode = "mes";
          const idx = +val;
          filteredPM = allPM.filter((m) => pmMesPct(m, idx) != null);
          title = `Atingimento de Medidas — ${MES[idx]}`;
          subtitle = `${filteredPM.length} medida(s) com previsto e realizado em ${MES[idx]}`;
          goAction = {
            label: "Ir para aba Planos de Medidas →",
            run: () => {
              tab = "pm";
            },
          };
        } else if (type === "grp") {
          mode = "both";
          const k = sub;
          filteredPA = allPA.filter(
            (p) =>
              ((k === "setor" ? getSetor(p) : p[k]) || "(Não informado)") ===
              val,
          );
          filteredPM = allPM.filter(
            (m) =>
              ((k === "setor" ? getSetor(m) : m[k]) || "(Não informado)") ===
              val,
          );
          const lblMap = {
            origem: "Origem",
            setor: "Setor",
            utd: "UTD",
            indicador: "Indicador",
          };
          title = `${lblMap[k] || "Grupo"}: ${val}`;
          subtitle = `${filteredPA.length} ação(ões) · ${filteredPM.length} medida(s)`;
          activeDrill.viewTab = viewTab || "pa";
          if (val !== "(Não informado)") {
            goAction = {
              label: "Aplicar filtro no painel →",
              run: () => {
                if (k === "origem") F.orig = val;
                else if (k === "setor") {
                  F.setor = val;
                  if (F.utd && setorDaUtd(F.utd) !== val) F.utd = "";
                } else if (k === "utd") {
                  F.utd = val;
                  F.setor = setorDaUtd(val) || F.setor;
                } else if (k === "indicador") F.ind = val;
                tab = activeDrill.viewTab === "pm" ? "pm" : "pa";
              },
            };
          }
        }

        const renderPATable = (list) => {
          if (!list.length)
            return `<p style="color:var(--m);text-align:center;padding:24px 0">Nenhum plano de ação neste recorte.</p>`;
          return `<table>
            <tr><th>UTD</th><th>Indicador</th><th>Ação</th><th>Medida Vinculada</th><th>Quem</th><th>Fim prev.</th><th>Status</th></tr>
            ${list
              .map((p) => {
                const m = p.pmId ? pmMap.get(p.pmId) : null;
                return `<tr class="row" data-drill-edit="pa:${esc(p.id)}" title="Clique para editar este plano">
                <td>${esc(p.utd)}</td>
                <td>${esc(p.indicador)}</td>
                <td>${esc(p.acao)}</td>
                <td>${m ? `<span class="link-badge">🔗 ${esc(m.medida.slice(0, 28))}${m.medida.length > 28 ? "…" : ""}</span>` : '<span class="warn">Sem vínculo</span>'}</td>
                <td>${esc(p.quem || "–")}</td>
                <td>${fd(p.fp)}</td>
                <td>${tag(stat(p))}</td>
              </tr>`;
              })
              .join("")}
          </table>`;
        };

        const renderPMTable = (list) => {
          if (!list.length)
            return `<p style="color:var(--m);text-align:center;padding:24px 0">Nenhuma medida neste recorte.</p>`;
          return `<table>
            <tr><th>UTD</th><th>Indicador</th><th>Medida</th><th>Ação Vinculada</th><th>Meta</th><th>Real / Prev.</th></tr>
            ${list
              .map((m) => {
                const r = pm(m);
                const p = m.paId ? paMap.get(m.paId) : null;
                return `<tr class="row" data-drill-edit="pm:${esc(m.id)}" title="Clique para editar esta medida">
                <td>${esc(m.utd)}</td>
                <td>${esc(m.indicador)}</td>
                <td>${esc(m.medida)}</td>
                <td>${p ? `<span class="link-badge">🔗 ${esc(p.acao.slice(0, 28))}${p.acao.length > 28 ? "…" : ""}</span>` : '<span class="warn">Sem vínculo</span>'}</td>
                <td>${fn(m.meta)} ${esc(m.unid)}</td>
                <td>${r ? `${tag(r.s)} ${fn(r.R)} / ${fn(r.P)} (${Math.round(r.pct * 100)}%)` : tag("Sem apuração")}</td>
              </tr>`;
              })
              .join("")}
          </table>`;
        };

        let contentHtml = "";

        if (mode === "pa") {
          /* Filtros rápidos por status se for responsável ou status geral */
          if (type === "resp") {
            const baseResp = allPA.filter(
              (p) => ((p.quem || "").trim() || "(Sem responsável)") === val,
            );
            const counts = {};
            baseResp.forEach((p) => {
              const s = stat(p);
              counts[s] = (counts[s] || 0) + 1;
            });
            contentHtml += `<div class="drill-tabs">
              <button class="${!sub ? "on" : ""}" data-drill-switch="resp" data-val="${esc(val)}" data-sub="">Todos (${baseResp.length})</button>
              ${["Concluído", "Em andamento", "A iniciar", "Atrasado"].map((s) => `<button class="${sub === s ? "on" : ""}" data-drill-switch="resp" data-val="${esc(val)}" data-sub="${esc(s)}">${s} (${counts[s] || 0})</button>`).join("")}
            </div>`;
          }
          contentHtml += renderPATable(filteredPA);
        } else if (mode === "pm") {
          const cnt = {
            Adequado: 0,
            Atenção: 0,
            Crítico: 0,
            "Sem apuração": 0,
          };
          allPM.forEach((m) => {
            const r = pm(m);
            const s = r ? r.s : "Sem apuração";
            cnt[s] = (cnt[s] || 0) + 1;
          });
          const cur = activeDrill.viewTab || "todas";
          contentHtml += `<div class="drill-tabs">
            <button class="${cur === "todas" ? "on" : ""}" data-drill-tab="todas">Todas (${allPM.length})</button>
            <button class="${cur === "Adequado" ? "on" : ""}" data-drill-tab="Adequado">Adequadas (${cnt.Adequado})</button>
            <button class="${cur === "Atenção" ? "on" : ""}" data-drill-tab="Atenção">Atenção (${cnt.Atenção})</button>
            <button class="${cur === "Crítico" ? "on" : ""}" data-drill-tab="Crítico">Críticas (${cnt.Crítico})</button>
            <button class="${cur === "Sem apuração" ? "on" : ""}" data-drill-tab="Sem apuração">Sem apuração (${cnt["Sem apuração"]})</button>
          </div>`;
          contentHtml += renderPMTable(filteredPM);
        } else if (mode === "both") {
          const cur = activeDrill.viewTab || "pa";
          contentHtml += `<div class="drill-tabs">
            <button class="${cur === "pa" ? "on" : ""}" data-drill-tab="pa">Planos de Ação (${filteredPA.length})</button>
            <button class="${cur === "pm" ? "on" : ""}" data-drill-tab="pm">Planos de Medidas (${filteredPM.length})</button>
          </div>`;
          contentHtml +=
            cur === "pa"
              ? renderPATable(filteredPA)
              : renderPMTable(filteredPM);
        } else if (mode === "mes") {
          const idx = +val;
          const sorted = [...filteredPM].sort(
            (a, b) => pmMesPct(a, idx) - pmMesPct(b, idx),
          );
          contentHtml = sorted.length
            ? `<table>
                <tr><th>Setor / UTD</th><th>Indicador</th><th>Medida</th><th>Prev. ${MES[idx]}</th><th>Real ${MES[idx]}</th><th>Atingimento</th></tr>
                ${sorted
                  .map((m) => {
                    const pct = pmMesPct(m, idx);
                    const pctInt = Math.round(pct * 100);
                    const stLbl =
                      pct >= 1
                        ? "Adequado"
                        : pct >= 0.8
                          ? "Atenção"
                          : "Crítico";
                    return `<tr class="row" data-drill-edit="pm:${esc(m.id)}" title="Clique para editar esta medida">
                    <td>${esc(getSetor(m))} · ${esc(m.utd)}</td>
                    <td>${esc(m.indicador)}</td>
                    <td>${esc(m.medida)}</td>
                    <td>${fn(m.prev[idx])} ${esc(m.unid)}</td>
                    <td><b>${fn(m.real[idx])} ${esc(m.unid)}</b></td>
                    <td>${tag(stLbl)} <b>${pctInt}%</b></td>
                  </tr>`;
                  })
                  .join("")}
              </table>`
            : `<p style="color:var(--m);text-align:center;padding:24px 0">Nenhuma medida apurada em ${MES[idx]}.</p>`;
        }

        const dlg = $("#drill");
        dlg.innerHTML = `
          <div class="mh">
            <div><div>${esc(title)}</div><small style="opacity:0.9;font-weight:400">${esc(subtitle)} · clique em qualquer item para editar</small></div>
            <button class="xclose" id="drill-close" title="Fechar">✕</button>
          </div>
          <div class="mb">${contentHtml}</div>
          <div class="mf">
            ${goAction ? `<button class="btn s" id="drill-go" style="margin-right:auto">${esc(goAction.label)}</button>` : ""}
            <button class="btn" id="drill-ok">Fechar</button>
          </div>
        `;
        if (!dlg.open) dlg.showModal();

        const closeDrill = () => {
          activeDrill = null;
          dlg.close();
        };
        $("#drill-close").onclick = closeDrill;
        $("#drill-ok").onclick = closeDrill;
        if (goAction) {
          $("#drill-go").onclick = () => {
            goAction.run();
            closeDrill();
            render();
          };
        }
      }

      function th(t, cols) {
        return (
          "<tr>" +
          cols
            .map(
              ([k, n]) =>
                `<th data-s="${t}:${k}">${n}${sort[t] && sort[t][0] == k ? (sort[t][1] > 0 ? " ▲" : " ▼") : ""}</th>`,
            )
            .join("") +
          "</tr>"
        );
      }

      function srt(t, a, f) {
        const s = sort[t];
        if (!s) return a;
        return [...a].sort((x, y) => {
          const u = f(x, s[0]),
            v = f(y, s[0]);
          return (u > v ? 1 : u < v ? -1 : 0) * s[1];
        });
      }

      function pa() {
        let a = live(S.PA).filter((p) =>
          match(p, (p) => !F.st || stat(p) == F.st),
        );
        const pmMap = new Map(live(S.PM).map((m) => [m.id, m]));
        a = srt("pa", a, (p, k) =>
          k == "st" ? stat(p) : k == "setor" ? getSetor(p) : p[k] || "",
        );
        return `<div class="card"><small>${a.length} ação(ões) · clique na linha para editar a Ação e sua Medida vinculada</small><table>${th(
          "pa",
          [
            ["origem", "Origem"],
            ["setor", "Setor"],
            ["utd", "UTD"],
            ["indicador", "Indicador"],
            ["acao", "Ação"],
            ["pmId", "Medida Vinculada"],
            ["quem", "Quem"],
            ["ip", "Início prev."],
            ["fp", "Fim prev."],
            ["fr", "Fim real"],
            ["st", "Status"],
          ],
        )}${a
          .map((p) => {
            const m = p.pmId ? pmMap.get(p.pmId) : null;
            return `<tr class="row" data-e="pa:${p.id}"><td>${esc(p.origem || "–")}</td><td>${esc(getSetor(p) || "–")}</td><td>${esc(p.utd)}</td><td>${esc(p.indicador)}</td><td>${esc(p.acao)}</td><td>${m ? `<span class="link-badge" title="${esc(m.medida)}">🔗 ${esc(m.id)}: ${esc(m.medida.slice(0, 32))}${m.medida.length > 32 ? "…" : ""}</span>` : '<span class="warn">Sem vínculo</span>'}</td><td>${esc(p.quem)}</td><td>${fd(p.ip)}</td><td>${fd(p.fp)}${p.ip && p.fp && p.fp < p.ip ? ' <span class="warn" title="Fim anterior ao início">⚠</span>' : ""}</td><td>${fd(p.fr)}</td><td>${tag(stat(p))}</td></tr>`;
          })
          .join("")}</table></div>`;
      }

      function pmv() {
        let a = live(S.PM).filter((m) => match(m));
        const paMap = new Map(live(S.PA).map((p) => [p.id, p]));
        a = srt("pm", a, (m, k) =>
          k == "pct"
            ? (pm(m)?.pct ?? -1)
            : k == "setor"
              ? getSetor(m)
              : m[k] || "",
        );
        return `<div class="card"><small>${a.length} medida(s) · adequado ≥100% · atenção ≥80% · crítico &lt;80% · clique na linha para editar</small><table>${th(
          "pm",
          [
            ["origem", "Origem"],
            ["setor", "Setor"],
            ["utd", "UTD"],
            ["indicador", "Indicador"],
            ["medida", "Medida"],
            ["paId", "Ação Vinculada"],
            ["meta", "Meta"],
            ["pct", "Real/Prev."],
            ["x", "Mensal (real)"],
          ],
        )}<tr style="display:none"></tr>${a
          .map((m) => {
            const r = pm(m),
              mx = Math.max(...m.real.map((v) => v || 0), 1);
            const p = m.paId ? paMap.get(m.paId) : null;
            return `<tr class="row" data-e="pm:${m.id}"><td>${esc(m.origem || "–")}</td><td>${esc(getSetor(m) || "–")}</td><td>${esc(m.utd)}</td><td>${esc(m.indicador)}</td><td>${esc(m.medida)}</td><td>${p ? `<span class="link-badge" title="${esc(p.acao)}">🔗 ${esc(p.id)}: ${esc(p.acao.slice(0, 32))}${p.acao.length > 32 ? "…" : ""}</span>` : '<span class="warn">Sem vínculo</span>'}</td><td>${fn(m.meta)} ${esc(m.unid)}</td><td>${r ? `${tag(r.s)} ${fn(r.R)} / ${fn(r.P)} (${Math.round(r.pct * 100)}%)` : tag("Sem apuração")}</td><td><div class="sp">${m.real.map((v, i) => `<i title="${MES[i]}: ${fn(v)}" style="height:${v ? Math.max(3, (v / mx) * 26) : 2}px;opacity:${v == null ? 0.25 : 1}"></i>`).join("")}</div></td></tr>`;
          })
          .join("")}</table></div>`;
      }

      function edit(t, id) {
        /* Todo Plano de Ação está vinculado a um Plano de Medida e vice-versa */
        let origPA = null,
          origPM = null;
        if (id) {
          if (t === "pa") {
            origPA = S.PA.find((x) => x.id === id) || null;
            if (origPA && origPA.pmId)
              origPM = S.PM.find((x) => x.id === origPA.pmId) || null;
          } else {
            origPM = S.PM.find((x) => x.id === id) || null;
            if (origPM && origPM.paId)
              origPA = S.PA.find((x) => x.id === origPM.paId) || null;
          }
        }

        const isNew = !origPA && !origPM;
        const defaultOrig = F.orig || "";
        const defaultSetor =
          F.setor ||
          setorDaOrigem(defaultOrig) ||
          (F.utd ? setorDaUtd(F.utd) : "");
        const defaultUtd = F.utd || "";

        const xPA = origPA
          ? JSON.parse(JSON.stringify(origPA))
          : {
              id: uid("PA"),
              origem: origPM?.origem || defaultOrig,
              setor: origPM ? getSetor(origPM) : defaultSetor,
              utd: origPM?.utd || defaultUtd,
              indicador: origPM?.indicador || F.ind || "",
              acao: "",
              causa: "",
              como: "",
              onde: "",
              quem: "",
              ip: "",
              fp: "",
              ir: "",
              fr: "",
              custo: "",
              obs: "",
              sm: "",
              pmId: origPM ? origPM.id : "",
            };

        const xPM = origPM
          ? JSON.parse(JSON.stringify(origPM))
          : {
              id: uid("PM"),
              origem: xPA.origem,
              setor: xPA.setor,
              utd: xPA.utd,
              indicador: xPA.indicador,
              medida: "",
              unid: "Qtd",
              sentido: "Quanto Maior Melhor",
              meta: null,
              prev: Array(12).fill(null),
              real: Array(12).fill(null),
              paId: xPA.id,
            };

        xPA.pmId = xPM.id;
        xPM.paId = xPA.id;
        xPA.setor = getSetor(xPA);

        const dlst = `<datalist id="di">${uniq("indicador")
          .map((u) => `<option>${esc(u)}</option>`)
          .join("")}</datalist>`;

        /* Outras PAs ou PMs disponíveis caso o usuário queira vincular a um registro já existente */
        const outrasPAs = live(S.PA).filter((p) => p.id !== xPA.id);
        const outrasPMs = live(S.PM).filter((m) => m.id !== xPM.id);

        const buildUtdOptions = (setorSel, utdAtual) => {
          const lista =
            setorSel && SETORES_UTDS[setorSel]
              ? SETORES_UTDS[setorSel]
              : TODAS_UTDS;
          const opts = [
            ...new Set([...lista, ...(utdAtual ? [utdAtual] : [])]),
          ];
          return (
            `<option value="">Selecione a UTD...</option>` +
            opts
              .map(
                (u) =>
                  `<option value="${esc(u)}" ${utdAtual === u ? "selected" : ""}>${esc(u)}</option>`,
              )
              .join("")
          );
        };

        const h = `
          <div class="sec-divider"><span>1. Identificação e Origem</span><small>${esc(xPA.id)} ⇄ ${esc(xPM.id)}</small></div>
          <div class="w"><label>Origem*</label>
            <select id="f-origem" data-pa="origem">
              <option value="">Selecione a origem...</option>
              ${ORIGENS.map((o) => `<option value="${esc(o)}" ${xPA.origem === o ? "selected" : ""}>${esc(o)}</option>`).join("")}
            </select>
          </div>
          <div><label>Setor*</label>
            <select id="f-setor" data-pa="setor">
              <option value="">Selecione o setor...</option>
              ${SETORES.map((s) => `<option value="${esc(s)}" ${xPA.setor === s ? "selected" : ""}>${esc(s)}</option>`).join("")}
            </select>
          </div>
          <div><label>Unidade (UTD)*</label>
            <select id="f-utd" data-pa="utd">
              ${buildUtdOptions(xPA.setor, xPA.utd)}
            </select>
          </div>
          <div><label>Indicador*</label>
            <input id="f-indicador" data-pa="indicador" list="di" placeholder="Ex: TMAE, EFC, Opex MSO..." value="${esc(xPA.indicador)}">
          </div>

          <div class="sec-divider">
            <span>2. Plano de Ação (${esc(xPA.id)})</span>
            ${!origPA && outrasPAs.length ? `<select id="link-existing-pa" style="font-size:12px;padding:3px 6px;width:auto"><option value="">+ Criar nova Ação vinculada</option>${outrasPAs.map((p) => `<option value="${esc(p.id)}">Vincular à Ação existente: ${esc(p.id)} - ${esc(p.acao.slice(0, 40))}</option>`).join("")}</select>` : ""}
          </div>
          <div class="w"><label>Ação (o quê / por quê)*</label><textarea data-pa="acao">${esc(xPA.acao)}</textarea></div>
          <div class="w"><label>Problema | Causa</label><textarea data-pa="causa">${esc(xPA.causa)}</textarea></div>
          <div class="w"><label>Como</label><textarea data-pa="como">${esc(xPA.como)}</textarea></div>
          <div><label>Onde</label><input data-pa="onde" value="${esc(xPA.onde)}"></div>
          <div><label>Quem (responsável)*</label><input data-pa="quem" placeholder="Nome do responsável" value="${esc(xPA.quem)}"></div>
          <div><label>Quanto custa</label><input data-pa="custo" value="${esc(xPA.custo)}"></div>
          <div><label>Início previsto</label><input type="date" data-pa="ip" value="${esc(xPA.ip)}"></div>
          <div><label>Fim previsto*</label><input type="date" data-pa="fp" value="${esc(xPA.fp)}"></div>
          <div><label>Início real</label><input type="date" data-pa="ir" value="${esc(xPA.ir)}"></div>
          <div><label>Fim real</label><input type="date" data-pa="fr" value="${esc(xPA.fr)}"></div>
          <div><label>Situação</label><select data-pa="sm"><option value="">Automática (pelas datas)</option><option ${xPA.sm == "Suspenso" ? "selected" : ""}>Suspenso</option><option ${xPA.sm == "Cancelado" ? "selected" : ""}>Cancelado</option></select></div>
          <div class="w"><label>Observação</label><textarea data-pa="obs">${esc(xPA.obs)}</textarea></div>

          <div class="sec-divider">
            <span>3. Plano de Medida Vinculado (${esc(xPM.id)})</span>
            ${!origPM && outrasPMs.length ? `<select id="link-existing-pm" style="font-size:12px;padding:3px 6px;width:auto"><option value="">+ Criar nova Medida vinculada</option>${outrasPMs.map((m) => `<option value="${esc(m.id)}">Vincular à Medida existente: ${esc(m.id)} - ${esc(m.medida.slice(0, 40))}</option>`).join("")}</select>` : ""}
          </div>
          <div class="w"><label>Medida*</label><textarea data-pm="medida">${esc(xPM.medida)}</textarea></div>
          <div><label>Unidade de Medida</label><select data-pm="unid">${["Qtd", "Nº", "%", "KM", "Turnos", "Min", "Demanda"].map((u) => `<option ${xPM.unid == u ? "selected" : ""}>${u}</option>`).join("")}</select></div>
          <div><label>Sentido</label><select data-pm="sentido"><option ${xPM.sentido && xPM.sentido[6] == "a" ? "selected" : ""}>Quanto Maior Melhor</option><option ${xPM.sentido && xPM.sentido[6] == "e" ? "selected" : ""}>Quanto Menor Melhor</option></select></div>
          <div><label>Meta (ano)*</label><input type="number" step="any" data-pm="meta" value="${xPM.meta ?? ""}"></div>
          <div class="w"><div class="mg"><b></b>${MES.map((m) => `<b>${m}</b>`).join("")}<b>Prev.</b>${xPM.prev.map((v, i) => `<input type="number" step="any" data-p="${i}" value="${v ?? ""}">`).join("")}<b>Real</b>${xPM.real.map((v, i) => `<input type="number" step="any" data-r="${i}" value="${v ?? ""}">`).join("")}</div></div>
        `;

        $("#dlg").innerHTML =
          `<div class="mh"><span>${isNew ? "Novo Plano Integrado (Ação + Medida)" : "Editar Plano Integrado (Ação + Medida)"}</span><small>${esc(xPA.id)} ⇄ ${esc(xPM.id)}</small></div><div class="mb"><div class="f">${h}</div>${dlst}<p class="warn" id="er"></p></div><div class="mf">${!isNew ? '<button class="btn d" id="del" style="margin-right:auto">Excluir Ação e Medida</button>' : ""}<button class="btn s" id="cx">Cancelar</button><button class="btn" id="ok">Salvar Ação e Medida</button></div>`;
        $("#dlg").showModal();

        /* Sincronização dinâmica de Origem -> Setor -> UTD dentro do Modal */
        const selOrig = $("#f-origem");
        const selSetor = $("#f-setor");
        const selUtd = $("#f-utd");

        selOrig.onchange = () => {
          const stAuto = setorDaOrigem(selOrig.value);
          if (stAuto) {
            selSetor.value = stAuto;
            const utdAtual = selUtd.value;
            const utdValida = SETORES_UTDS[stAuto]?.includes(utdAtual)
              ? utdAtual
              : "";
            selUtd.innerHTML = buildUtdOptions(stAuto, utdValida);
          }
        };

        selSetor.onchange = () => {
          const st = selSetor.value;
          const utdAtual = selUtd.value;
          const utdValida =
            !st || SETORES_UTDS[st]?.includes(utdAtual) ? utdAtual : "";
          selUtd.innerHTML = buildUtdOptions(st, utdValida);
        };

        selUtd.onchange = () => {
          const stUtd = setorDaUtd(selUtd.value);
          if (stUtd && selSetor.value !== stUtd) {
            selSetor.value = stUtd;
          }
        };

        /* Caso o usuário escolha vincular uma PA ou PM existente no dropdown */
        const linkPA = $("#link-existing-pa");
        if (linkPA) {
          linkPA.onchange = () => {
            const p = S.PA.find((item) => item.id === linkPA.value);
            if (p) {
              origPA = p;
              xPA.id = p.id;
              document.querySelectorAll("#dlg [data-pa]").forEach((el) => {
                const k = el.dataset.pa;
                if (p[k] !== undefined) el.value = p[k];
              });
              selSetor.value = getSetor(p);
              selUtd.innerHTML = buildUtdOptions(selSetor.value, p.utd);
            }
          };
        }

        const linkPM = $("#link-existing-pm");
        if (linkPM) {
          linkPM.onchange = () => {
            const m = S.PM.find((item) => item.id === linkPM.value);
            if (m) {
              origPM = m;
              xPM.id = m.id;
              document.querySelectorAll("#dlg [data-pm]").forEach((el) => {
                const k = el.dataset.pm;
                if (m[k] !== undefined) el.value = m[k] ?? "";
              });
              document.querySelectorAll("#dlg [data-p]").forEach((el) => {
                el.value = m.prev[el.dataset.p] ?? "";
              });
              document.querySelectorAll("#dlg [data-r]").forEach((el) => {
                el.value = m.real[el.dataset.r] ?? "";
              });
            }
          };
        }

        $("#cx").onclick = () => $("#dlg").close();

        if (!isNew) {
          $("#del").onclick = () => {
            if (
              confirm(
                "Excluir este Plano de Ação e o Plano de Medida vinculado?",
              )
            ) {
              const now = Date.now();
              const toPush = [];
              if (origPA) {
                origPA.del = 1;
                origPA.upd = now;
                origPA.by = user;
                toPush.push(["PA", origPA]);
              }
              if (origPM) {
                origPM.del = 1;
                origPM.upd = now;
                origPM.by = user;
                toPush.push(["PM", origPM]);
              }
              push(toPush);
              $("#dlg").close();
              render();
            }
          };
        }

        $("#ok").onclick = () => {
          document.querySelectorAll("#dlg [data-pa]").forEach((e) => {
            xPA[e.dataset.pa] = e.value.trim();
          });
          document.querySelectorAll("#dlg [data-pm]").forEach((e) => {
            xPM[e.dataset.pm] =
              e.type == "number"
                ? e.value === ""
                  ? null
                  : +e.value
                : e.value.trim();
          });
          document
            .querySelectorAll("#dlg [data-p]")
            .forEach(
              (e) => (xPM.prev[e.dataset.p] = e.value === "" ? null : +e.value),
            );
          document
            .querySelectorAll("#dlg [data-r]")
            .forEach(
              (e) => (xPM.real[e.dataset.r] = e.value === "" ? null : +e.value),
            );

          /* Sincroniza metadados compartilhados entre Ação e Medida */
          xPM.origem = xPA.origem;
          xPM.setor = xPA.setor;
          xPM.utd = xPA.utd;
          xPM.indicador = xPA.indicador;
          xPA.pmId = xPM.id;
          xPM.paId = xPA.id;

          const er = [];
          if (!xPA.origem) er.push("Selecione a Origem.");
          if (!xPA.setor) er.push("Selecione o Setor.");
          if (!xPA.utd) er.push("Selecione a Unidade (UTD).");
          if (!xPA.indicador) er.push("Informe o Indicador.");
          if (!xPA.acao) er.push("Descreva o Plano de Ação (o quê / por quê).");
          if (!xPA.quem)
            er.push("Informe o responsável (Quem) pelo Plano de Ação.");
          if (!xPA.fp) er.push("Informe o Fim Previsto do Plano de Ação.");
          if (xPA.ip && xPA.fp && xPA.fp < xPA.ip)
            er.push("Fim previsto não pode ser anterior ao início previsto.");
          if (xPA.ir && xPA.fr && xPA.fr < xPA.ir)
            er.push("Fim real não pode ser anterior ao início real.");
          if (xPA.fr && !xPA.ir)
            er.push("Informe o início real para registrar o fim real.");
          if (!xPM.medida) er.push("Descreva o Plano de Medida vinculado.");
          if (xPM.meta === null || isNaN(xPM.meta))
            er.push("Informe a Meta (ano) do Plano de Medida.");

          if (er.length) {
            $("#er").innerHTML = er.map(esc).join("<br>");
            return;
          }

          const now = Date.now();
          xPA.upd = now;
          xPA.by = user;
          xPM.upd = now;
          xPM.by = user;

          if (origPA) Object.assign(origPA, xPA);
          else S.PA.push(xPA);
          if (origPM) Object.assign(origPM, xPM);
          else S.PM.push(xPM);

          push([
            ["PA", origPA || xPA],
            ["PM", origPM || xPM],
          ]);
          $("#dlg").close();
          render();
          toast("Plano de Ação e Plano de Medida salvos com sucesso!");
        };
      }

      document.addEventListener("click", (e) => {
        /* Cliques dentro do modal de detalhamento */
        const dSwitch = e.target.closest("[data-drill-switch]");
        if (dSwitch) {
          e.preventDefault();
          openDrill(
            dSwitch.dataset.drillSwitch,
            dSwitch.dataset.val,
            dSwitch.dataset.sub || "",
          );
          return;
        }
        const dTab = e.target.closest("[data-drill-tab]");
        if (dTab && activeDrill) {
          e.preventDefault();
          openDrill(
            activeDrill.type,
            activeDrill.val,
            activeDrill.sub,
            dTab.dataset.drillTab,
          );
          return;
        }
        const dEdit = e.target.closest("[data-drill-edit]");
        if (dEdit) {
          e.preventDefault();
          const [t, id] = dEdit.dataset.drillEdit.split(":");
          edit(t, id);
          return;
        }

        /* Cliques interativos de drill-down na visão geral (KPIs, Top 10, Barras mensais, Grupos) */
        const drillEl = e.target.closest("[data-drill]");
        if (drillEl) {
          e.preventDefault();
          openDrill(
            drillEl.dataset.drill,
            drillEl.dataset.val ?? "",
            drillEl.dataset.sub ?? "",
          );
          return;
        }

        /* Botão limpar filtros */
        if (e.target.closest("#clr-flt")) {
          e.preventDefault();
          F = { orig: "", setor: "", utd: "", ind: "", q: "", st: "" };
          render();
          return;
        }

        const q = e.target.closest("[data-t],[data-n],[data-e],[data-s],#usr");
        if (!q) return;
        e.preventDefault();
        if (q.dataset.t) {
          tab = q.dataset.t;
          render();
        } else if (q.dataset.n) edit(q.dataset.n);
        else if (q.dataset.e) {
          const [t, id] = q.dataset.e.split(":");
          edit(t, id);
        } else if (q.dataset.s) {
          const [t, k] = q.dataset.s.split(":");
          const s = sort[t];
          sort[t] = [k, s && s[0] == k ? -s[1] : 1];
          render();
        } else if (q.id === "usr") {
          if (confirm("Deseja desconectar sua sessão?")) {
            localStorage.removeItem(K + "_user");
            location.reload();
          }
        }
      });

      /* Fechar o modal de detalhamento ao clicar fora (backdrop) */
      $("#drill").addEventListener("click", (e) => {
        if (e.target === $("#drill")) {
          activeDrill = null;
          $("#drill").close();
        }
      });

      document.addEventListener("input", (e) => {
        if (e.target.id == "fq") {
          F.q = e.target.value;
          $("#v").innerHTML = { geral, pa, pm: pmv }[tab]();
        }
      });
      document.addEventListener("change", (e) => {
        if (e.target.id == "fo") {
          F.orig = e.target.value;
          const stAuto = setorDaOrigem(F.orig);
          if (stAuto) {
            F.setor = stAuto;
            if (F.utd && setorDaUtd(F.utd) !== stAuto) F.utd = "";
          }
        } else if (e.target.id == "fset") {
          F.setor = e.target.value;
          if (F.utd && F.setor && setorDaUtd(F.utd) !== F.setor) F.utd = "";
        } else if (e.target.id == "fu") {
          F.utd = e.target.value;
          if (F.utd) F.setor = setorDaUtd(F.utd) || F.setor;
        } else if (e.target.id == "fi") F.ind = e.target.value;
        else if (e.target.id == "fs") F.st = e.target.value;
        else return;
        render();
      });

      const HD = () => ({
        apikey: SB.key,
        Authorization: "Bearer " + SB.key,
        "Content-Type": "application/json",
      });

      function setSy(s) {
        $("#dot").className =
          "dot" + (s == "ok" ? " on" : s == "err" ? " err" : "");
        $("#sy").textContent =
          s == "ok"
            ? "Sincronizado · " +
              new Date().toLocaleTimeString("pt-BR").slice(0, 5)
            : s == "err"
              ? "Erro de conexão"
              : "Conectando...";
      }

      async function push(l) {
        if (!SB.url || !SB.key || !l.length) return;
        try {
          for (let i = 0; i < l.length; i += 200) {
            const r = await fetch(
              SB.url + "/rest/v1/registros?on_conflict=id",
              {
                method: "POST",
                headers: {
                  ...HD(),
                  Prefer: "resolution=merge-duplicates,return=minimal",
                },
                body: JSON.stringify(
                  l.slice(i, i + 200).map(([t, x]) => ({
                    id: x.id,
                    tipo: t,
                    dados: x,
                    upd: x.upd || 0,
                  })),
                ),
              },
            );
            if (!r.ok) throw 0;
          }
          setSy("ok");
        } catch (e) {
          setSy("err");
          toast("Erro ao salvar na nuvem.");
        }
      }

      async function pull() {
        if (!SB.url || !SB.key) return;
        try {
          let rows = [];
          for (let o = 0; ; o += 1000) {
            const r = await fetch(
              SB.url +
                `/rest/v1/registros?select=*&order=id&limit=1000&offset=${o}`,
              { headers: HD() },
            );
            if (!r.ok) throw 0;
            const p = await r.json();
            rows = rows.concat(p);
            if (p.length < 1000) break;
          }
          S = { PA: [], PM: [] };
          rows.forEach((w) => {
            if (S[w.tipo] && w.dados) S[w.tipo].push(w.dados);
          });
          setSy("ok");
          if (
            !$("#dlg").open &&
            !document.activeElement.matches("input,textarea")
          )
            render();
        } catch (e) {
          setSy("err");
        }
      }

      function startApp() {
        render();
        if (!SB.url || !SB.key) {
          setSy("err");
          toast("Configure a URL e Key do Supabase no final do código HTML.");
          return;
        }
        setSy("load");
        pull();
        setInterval(pull, 30000);
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) pull();
        });
      }
    </script>
  </body>
</html>

    <style>
      :root {
        --g: #00a443;
        --b: #0da9ff;
        --o: #ff9c1a;
        --ink: #0f2a22;
        --mut: #5b6b66;
        --bg: #f2f7f5;
        --ln: #e1ebe7;
        --r: #e5484d;
        --c: #fff;
        --t: var(--ink);
        --m: var(--mut);
        --l: var(--ln);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.4 "Segoe UI",
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--t);
      }
      header {
        background: linear-gradient(110deg, var(--g), #0b9a8a 55%, var(--b));
        color: #fff;
        padding: 18px 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
      }
      header h1 {
        font-size: 22px;
        margin: 0;
      }
      header small {
        opacity: 0.9;
      }
      .pill {
        background: rgba(255, 255, 255, 0.18);
        padding: 6px 12px;
        border-radius: 99px;
        font-size: 13px;
        display: flex;
        gap: 7px;
        align-items: center;
        margin-right: 8px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--o);
      }
      .dot.on {
        background: #7cffb0;
        box-shadow: 0 0 0 3px rgba(124, 255, 176, 0.3);
      }
      .dot.err {
        background: var(--r);
      }
      header small {
        opacity: 0.85;
      }
      nav {
        display: flex;
        gap: 4px;
        padding: 8px 20px 0;
        background: var(--c);
        border-bottom: 1px solid var(--l);
        flex-wrap: wrap;
      }
      nav button {
        border: 0;
        background: none;
        padding: 10px 16px;
        cursor: pointer;
        color: var(--m);
        font-weight: 600;
        border-bottom: 3px solid transparent;
        font-size: 14px;
      }
      nav button.on {
        color: var(--g);
        border-color: var(--g);
      }
      main {
        padding: 16px 20px;
        max-width: 1500px;
        margin: auto;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
        align-items: center;
      }
      input,
      select,
      textarea {
        font: inherit;
        padding: 7px 9px;
        border: 1px solid var(--l);
        border-radius: 6px;
        background: var(--c);
        color: var(--t);
        max-width: 100%;
      }
      textarea {
        width: 100%;
        min-height: 54px;
      }
      button.btn {
        background: var(--g);
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 8px 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button.btn.s {
        background: var(--c);
        color: var(--t);
        border: 1px solid var(--l);
      }
      button.btn.d {
        background: var(--r);
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }
      .k {
        background: #fff;
        border-radius: 14px;
        padding: 12px 14px;
        border-top: 3px solid var(--g);
        box-shadow: 0 1px 3px rgba(15, 42, 34, 0.08);
      }
      .k:first-child {
        background: var(--g);
        color: #fff;
      }
      .k:first-child span {
        color: #dff5e8;
      }
      .k b {
        font-size: 28px;
        display: block;
      }
      .k span {
        color: var(--m);
        font-size: 12px;
      }
      .card {
        background: #fff;
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 1px 3px rgba(15, 42, 34, 0.08);
        border-top: 3px solid var(--g);
        overflow: auto;
      }
      .card h2 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        padding: 7px 9px;
        border-bottom: 1px solid var(--l);
        text-align: left;
        vertical-align: top;
      }
      th {
        font-size: 11px;
        color: var(--m);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        position: sticky;
        top: 0;
        background: #fff;
        cursor: pointer;
        white-space: nowrap;
      }
      tr.row {
        cursor: pointer;
      }
      tr.row:hover {
        background: #00a44312;
      }
      .tag {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 600;
        color: #fff;
        white-space: nowrap;
      }
      .Concluído,
      .Adequado {
        background: var(--g);
      }
      .Em.andamento,
      .Andamento {
        background: var(--b);
      }
      .Atrasado,
      .Crítico {
        background: var(--r);
      }
      .A.iniciar,
      .Atenção {
        background: var(--o);
      }
      .Suspenso,
      .Cancelado,
      .Sem {
        background: #8a8f98;
      }
      .pb {
        height: 8px;
        background: var(--l);
        border-radius: 5px;
        overflow: hidden;
        min-width: 70px;
        display: flex;
      }
      .pb i {
        display: block;
        height: 100%;
      }
      .sp {
        display: flex;
        gap: 2px;
        align-items: flex-end;
        height: 26px;
      }
      .sp i {
        width: 7px;
        background: var(--b);
        border-radius: 2px 2px 0 0;
      }
      dialog {
        border: 0;
        border-radius: 12px;
        padding: 0;
        width: min(900px, 95vw);
        background: var(--c);
        color: var(--t);
        max-height: 92vh;
      }
      dialog::backdrop {
        background: #0008;
      }
      .mh {
        padding: 14px 18px;
        background: var(--g);
        color: #fff;
        font-weight: 700;
      }
      .mb {
        padding: 16px 18px;
        overflow: auto;
        max-height: 68vh;
      }
      .mf {
        padding: 12px 18px;
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        border-top: 1px solid var(--l);
      }
      .f {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 10px;
      }
      .f label {
        display: block;
        font-size: 12px;
        color: var(--m);
        font-weight: 600;
      }
      .f .w {
        grid-column: 1/-1;
      }
      .f input,
      .f select {
        width: 100%;
      }
      .mg {
        display: grid;
        grid-template-columns: 50px repeat(12, 1fr);
        gap: 4px;
        margin-top: 8px;
        align-items: center;
        font-size: 12px;
      }
      .mg input {
        width: 100%;
        padding: 5px 3px;
        text-align: center;
      }
      .warn {
        color: var(--r);
        font-size: 12px;
      }
      .ban {
        background: #ff9c1a22;
        border: 1px solid var(--o);
        padding: 8px 12px;
        border-radius: 8px;
        margin-bottom: 12px;
      }
      #toast {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        background: #222;
        color: #fff;
        padding: 10px 18px;
        border-radius: 8px;
        display: none;
        z-index: 99;
      }
    </style>
  </head>

          const up = all().filter(([t, x]) =>
            !cl.has(x.id)
              ? rows.length == 0 || x.upd > 0
              : (x.upd || 0) > (cl.get(x.id).upd || 0),
          );
          if (n) {
            save(1);
            if (
              !$("#dlg").open &&
              !document.activeElement.matches("input,textarea")
            )
              render();
          }
          setSy("ok");
          if (up.length) await push(up);
        } catch (e) {
          setSy("err");
        }
      }
      if (cloud()) {
        setSy();
        pull();
        setInterval(pull, 60000);
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) pull();
        });
      } else setSy();
      render();
    </script>
  </body>
</html>
